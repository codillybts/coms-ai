    case "fe-approve-clean": { const list = scopeList(S.fes).filter(f => f.status === "pending" && (f.checks || []).every(c => c[0] === "good")); for (const f of list) await saveDoc("first_emails", Object.assign({}, f, { status: "approved", approvedAt: Date.now(), approvedBy: ME })); render(); toast(`Approved ${list.length}.`); break; }
    case "fe-reject": { const f = S.fes.find(x => x.id === id); if (f) { await saveDoc("first_emails", Object.assign({}, f, { status: "rejected" })); render(); toast("Rejected. That lead won't be emailed.", "x"); } break; }
    case "fe-edit": { if (S.feEdit === id) { const f = Object.assign({}, S.fes.find(x => x.id === id), S.feLocal[id] || {}); delete S.feLocal[id]; const l = S.leads.find(x => x.id === f.leadId) || {}; const bb = S.biz.find(x => x.id === f.biz) || b; f.checks = feChecks(f, bb, l); await saveDoc("first_emails", f); S.feEdit = null; } else S.feEdit = id; render(); break; }
    case "push-approved": S.modal = { type: "push" }; render(); break;
    case "push-go": pushApproved($("#push-camp").value); break;
    /* campaigns */
    case "new-campaign": if (S.bizId === "all") { toast("Pick a business at the top of the menu first.", "info"); break; } S.modal = { type: "new-campaign", w: { step: "form" } }; render(); break;
    case "nc-create": { const w = S.modal.w; w.name = $("#nc-name").value.trim(); if (!w.name) { $("#nc-name").focus(); toast("Give the campaign a name.", "info"); return; } w.seq = $("#nc-seq").value; w.days = $("#nc-days").value.split(",").map(Number); [w.start, w.end] = $("#nc-hrs").value.split("-"); w.tz = $("#nc-tz").value.trim() || "UTC"; w.max = $("#nc-max").value; w.mailboxes = [...document.querySelectorAll("[data-mb]")].filter(x => x.getAttribute("aria-checked") === "true").map(x => x.dataset.mb); createCampaign(w); break; }
    case "camp-status": { const c = S.campaigns.find(x => String(x.id) === String(id)); try { await sl("update_campaign_status", { id: Number(id), status: a.dataset.v }, { write: true }); c.status = a.dataset.v === "START" ? "ACTIVE" : a.dataset.v; render(); toast(`${c.name} ${a.dataset.v === "START" ? "resumed" : "paused"} in Smartlead`, a.dataset.v === "START" ? "play" : "pause"); } catch (er) { toast(errCopy(er), "alert"); } break; }
    case "camp-launch": S.modal = { type: "launch", id }; render(); launchCheck(id); break;
    case "camp-start": { try { await sl("update_campaign_status", { id: Number(id), status: "START" }, { write: true }); S.modal = null; loadCampaigns(true); toast("Launched. Emails go out on its schedule.", "play"); } catch (er) { toast(errCopy(er), "alert"); } break; }
    /* tasks, rules, agent */
    case "task": { const k = S.tasks.find(x => x.id === id); if (k) { await saveDoc("tasks", Object.assign({}, k, { done: !k.done })); render(); } break; }
    case "add-task": { const t = { id: uid("t"), biz: S.bizId === "all" ? "" : S.bizId, t: "New task", due: 0, done: false, createdAt: Date.now() }; S.taskEdit.add(t.id); await saveDoc("tasks", t); render(); setTimeout(() => { const el = $("#task-" + t.id); if (el) { el.focus(); el.select(); } }); break; }
    case "auto": { if (S.bizId === "all") break; const r = b.automations.find(x => x.id === id); r.on = !r.on; await saveBiz(b); render(); toast(`Rule ${r.on ? "on" : "off"}`); break; }
    case "contacts": S.contacts = a.dataset.v; render(); break;
    case "rule-add": b.voice.rules.push(""); await saveBiz(b); render(); setTimeout(() => $("#rule-" + (b.voice.rules.length - 1))?.focus()); break;
    case "rule-del": b.voice.rules.splice(+a.dataset.i, 1); await saveBiz(b); render(); break;
    case "ban-del": b.voice.banned.splice(+a.dataset.i, 1); await saveBiz(b); render(); break;
    case "rebuild-voice": toast('In Claude Code, share past emails and say "rebuild my voice rules"', "spark"); break;
    /* mailboxes, linkedin, dnc, inbound, calendar */
    case "add-mailboxes": S.modal = { type: "add-mailboxes" }; render(); break;
    case "li-connect": S.modal = { type: "li-connect", v: a.dataset.v }; render(); break;
    case "sdr-save": { b.linkedin.sdr = { name: $("#sdr-name").value.trim(), signAs: $("#sdr-sign").value, instructions: $("#sdr-how").value.trim() }; await saveBiz(b); toast(`${b.linkedin.sdr.name || "Your AI SDR"} saved.`, "spark"); break; }
    case "dnc-add": { const w = $("#dnc-add").value.trim(); if (!w) { $("#dnc-add").focus(); return; } await blockContact({ who: w, why: $("#dnc-why").value.trim(), biz: S.bizId === "all" ? "" : S.bizId }); render(); break; }
    case "inb-draft": { const x = S.inbound.find(y => y.id === id); if (x) draftInbound(x); break; }
    case "inb-ask": S.inbConfirm = id; render(); break;
    case "inb-cancel": S.inbConfirm = null; render(); break;
    case "inb-go": { const x = S.inbound.find(y => y.id === id); if (!x) break; const body = ($("#inb-" + CSS.escape(id)) || {}).value || x.draft, subj = ($("#inb-s-" + CSS.escape(id)) || {}).value || x.subject; try { await sendManual(S.biz.find(y => y.id === x.biz) || b, x.email, subj, body, { name: x.name, company: x.company }); await saveDoc("inbound", Object.assign({}, x, { draft: body, subject: subj, status: "sent", sentAt: Date.now(), sentBy: ME })); S.inbConfirm = null; render(); toast(`Sent to ${x.email}. Their answer shows up in your Inbox.`, "send"); } catch (er) { S.inbConfirm = null; render(); toast(errCopy(er), "alert"); } break; }
    case "inb-spam": case "inb-notspam": case "inb-done": { const x = S.inbound.find(y => y.id === id); if (x) { await saveDoc("inbound", Object.assign({}, x, { status: act === "inb-spam" ? "spam" : act === "inb-done" ? "done" : "new" })); render(); } break; }
    case "inb-lead": { const x = S.inbound.find(y => y.id === id); if (x) { await saveDoc("leads", { id: uid("l"), biz: x.biz, name: x.name, email: x.email, company: x.company, title: x.title, emailSource: "Inbound: " + (x.source || ""), status: "New", via: "Inbound", signal: String(x.msg || "").slice(0, 120), createdAt: Date.now() }); toast(`${x.name || x.email} added to Leads`, "userplus"); } break; }
    case "inbound-toggle": { if (b.inbound.on) { b.inbound.on = false; await saveBiz(b); render(); toast("Inbound section hidden", "x"); } else if (!b.inbound.source) { S.modal = { type: "inbound-setup" }; render(); setTimeout(() => $("#inb-setup-source")?.focus()); } else { b.inbound.on = true; await saveBiz(b); render(); } break; }
    case "inbound-save": { const src = $("#inb-setup-source").value.trim(); if (!src) { $("#inb-setup-source").focus(); toast("Describe where inbound leads come from first.", "info"); return; } b.inbound = { on: true, source: src, how: $("#inb-setup-how").value }; await saveBiz(b); S.modal = null; render(); toast('Inbound is on. Tell Claude "connect my inbound leads" to pull them in.', "download"); break; }
    case "cal-connect": S.modal = { type: "cal-connect", v: a.dataset.v }; render(); break;
    case "cal-prep": S.modal = { type: "prep", id }; render(); break;
    case "cal-copy": { const u = b.calendarLink; (navigator.clipboard ? navigator.clipboard.writeText(u) : Promise.reject()).then(() => toast("Booking link copied", "copy")).catch(() => toast(u, "copy")); break; }
    case "crm": S.crmPick = null; S.modal = { type: "crm" }; render(); break;
    case "crm-pick": S.crmPick = a.dataset.v; render(); break;
    case "crm-save": { if (!S.crmPick) { toast("Pick your CRM first", "info"); return; } b.crm = Object.assign({}, b.crm, { tool: S.crmPick }); await saveBiz(b); S.modal = null; render(); toast(`Saved. In Claude Code say "connect my CRM" to set up ${S.crmPick}.`, "building"); break; }
    case "verifier": S.modal = { type: "verifier" }; render(); break;
    /* settings */
    case "set-tab": S.settings = a.dataset.v; render(); break;
    case "brand": b.brand = a.dataset.v; await saveBiz(b); render(); break;
    case "autosend": if (S.app.autoSend && S.app.autoSend.on) { await saveApp({ autoSend: Object.assign({}, S.app.autoSend, { on: false }) }); render(); toast("Auto-send off. Every email waits for your click.", "lock"); } else { S.modal = { type: "autosend" }; render(); } break;
    case "autosend-on": await saveApp({ autoSend: Object.assign({ notInterested: true }, S.app.autoSend, { on: true }) }); S.modal = null; render(); toast("Auto-send on for low-risk replies only", "bolt"); break;
    case "autokind": { const as = Object.assign({}, S.app.autoSend); as[a.dataset.v] = !as[a.dataset.v]; await saveApp({ autoSend: as }); render(); break; }
    case "assign": await saveApp({ team: Object.assign({}, S.app.team, { assign: !(S.app.team && S.app.team.assign) }) }); render(); break;
    case "stage-add": b.stages.push({ id: "New stage", color: "#7a8293", odds: 20 }); await saveBiz(b); render(); break;
    case "stage-del": if (b.stages.length > 2) { b.stages.splice(+a.dataset.i, 1); await saveBiz(b); render(); } break;
  }
});
let bizSaveT = null; const saveBizSoon = b => { clearTimeout(bizSaveT); bizSaveT = setTimeout(() => saveBiz(b), 600); };
let tSaveT = {}; const saveTSoon = (t, patch) => { Object.assign(S.tdocs[t.id] = S.tdocs[t.id] || {}, patch); clearTimeout(tSaveT[t.id]); tSaveT[t.id] = setTimeout(() => saveT(t, patch), 700); };
document.addEventListener("input", e => {
  const a = e.target.closest("[data-act]"); if (!a) return; const b = B();
  switch (a.dataset.act) {
    case "lead-q": S.leadsUI.q = a.value; render(); break;
    case "gsearch": S.searchBar = a.value; break;
    case "draft-edit": { const t = allThreads().find(x => x.id === a.dataset.id); if (t) saveTSoon(t, a.dataset.mode === "nudge" ? { nudgeDraft: a.value } : { edit: a.value }); break; }
    case "deal-value": { const t = allThreads().find(x => x.id === a.dataset.id); if (t) saveTSoon(t, { value: num(String(a.value).replace(/[^0-9.]/g, "")) }); break; }
    case "assign-to": { const t = allThreads().find(x => x.id === a.dataset.id); if (t) saveTSoon(t, { assignee: a.value }); break; }
    case "fe-field": { (S.feLocal[a.dataset.id] = S.feLocal[a.dataset.id] || {})[a.dataset.k] = a.value; break; }
    case "inb-edit": case "inb-subj": { const x = S.inbound.find(y => y.id === a.dataset.id); if (x) { x[a.dataset.act === "inb-edit" ? "draft" : "subject"] = a.value; clearTimeout(x._t); x._t = setTimeout(() => saveDoc("inbound", Object.assign({}, x, { _t: undefined })), 700); } break; }
    case "rule": b.voice.rules[+a.dataset.i] = a.value; saveBizSoon(b); break;
    case "voice-tone": b.voice.tone = a.value; saveBizSoon(b); break;
    case "biz-field": b[a.dataset.k] = a.value; if (a.dataset.k === "name") b.initials = initials(a.value); saveBizSoon(b); paintNav(); break;
    case "inb-source": b.inbound.source = a.value; saveBizSoon(b); break;
    case "stage-odds": b.stages[+a.dataset.i].odds = Math.min(100, Math.max(0, num(a.value))); saveBizSoon(b); break;
    case "brand-custom": b.brand = a.value; document.documentElement.style.setProperty("--brand", a.value); saveBizSoon(b); break;
    case "task-text": { const k = S.tasks.find(x => x.id === a.dataset.id); if (k) { k.t = a.value; clearTimeout(k._t); k._t = setTimeout(() => saveDoc("tasks", Object.assign({}, k, { editing: undefined, _t: undefined })), 700); } break; }
  }
});
document.addEventListener("change", async e => {
  const a = e.target.closest("[data-act]"); if (!a) return; const b = B();
  if (a.dataset.act === "imp-file") readFile(a.files[0]);
  if (a.dataset.act === "imp-map") { S.importer.map[+a.dataset.i] = a.value; render(); }
  if (a.dataset.act === "stage") { const t = allThreads().find(x => x.id === a.dataset.id); if (t) { saveT(t, { stage: a.value }); toast(`${t.company || t.name} moved to ${a.value}`); } }
  if (a.dataset.act === "inb-how") { b.inbound.how = a.value; saveBiz(b); }
  if (a.dataset.act === "open-page") saveApp({ openPage: a.value });
  if (a.dataset.act === "stage-color") { b.stages[+a.dataset.i].color = a.value; saveBiz(b); }
  if (a.dataset.act === "stage-name") { const st = b.stages[+a.dataset.i], old = st.id, nv = a.value.trim(); if (!nv || nv === old || b.stages.some(s => s.id === nv)) { a.value = old; return; } st.id = nv; await saveBiz(b); for (const t of allThreads()) if (t.biz === b.id || !t.biz) { if (td(t).stage === old) await saveT(t, { stage: nv }); } toast(`Renamed to ${nv}. Deals moved with it.`); }
  if (a.dataset.act === "brand-custom") render();
  if (a.dataset.act === "logo") { const f = a.files[0]; if (!f) return; if (f.size > 2e6) return toast("Pick an image under 2 MB", "alert"); try { const r = await ASSETS.upload(f); b.logoUrl = r.url; await saveBiz(b); render(); toast("Logo updated"); } catch (er) { toast("Couldn't upload the logo. Give it to Claude instead.", "alert"); } }
});
document.addEventListener("keydown", e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName || "");
  if (e.key === "Escape") { if (S.modal) { S.modal = null; S.importer = null; render(); } else if (S.navOpen || S.bizMenu) { S.navOpen = false; S.bizMenu = false; render(); } return; }
  if (e.key === "Enter" && e.target.id === "ban-add" && e.target.value.trim()) { const b = B(); b.voice.banned.push(e.target.value.trim()); saveBiz(b); render(); setTimeout(() => $("#ban-add")?.focus()); return; }
  if (e.key === "Enter" && e.target.id === "gsearch") { S.leadsUI.q = e.target.value; S.leadsUI.filter = "all"; go("leads"); return; }
  if (e.key === "Enter" && e.target.classList.contains("ib-item")) { e.target.click(); return; }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "/") { e.preventDefault(); $("#gsearch")?.focus(); return; }
  if (e.key === "?") { e.preventDefault(); S.modal = { type: "shortcuts" }; render(); return; }
  if (e.key === "[") { e.preventDefault(); toggleMenu(); return; }
  if (S.view === "inbox" && !S.modal) {
    const items = [...document.querySelectorAll(".ib-item[data-id]")].map(x => x.dataset.id), i = items.indexOf(S.ib.sel);
    if (e.key === "j" || e.key === "k") { e.preventDefault(); const n = items[Math.max(0, Math.min(items.length - 1, i + (e.key === "j" ? 1 : -1)))]; if (n) { S.ib.sel = n; S.ib.confirm = false; render(); document.querySelector(`.ib-item[data-id="${CSS.escape(n)}"]`)?.scrollIntoView({ block: "nearest" }); } return; }
    if (e.key === "e" && S.ib.sel) { e.preventDefault(); const t = allThreads().find(x => x.id === S.ib.sel); if (t && !isDone(t)) { saveT(t, { handled: true }); S.ib.sel = null; render(); toast("Marked handled", "archive"); } return; }
  }
});
document.addEventListener("click", e => { if (S.navOpen && e.target.closest(".app") && !e.target.closest(".rail") && !e.target.closest("[data-act=nav-open]")) { S.navOpen = false; render(); } }, true);

/* ---------- auto-send (opt-in, only while the page is open) ---------- */
async function autoSendPass() {
  const as = S.app.autoSend || {}; if (!as.on || !as.notInterested || !MCP) return;
  for (const t of S.threads.filter(x => x.channel === "email")) {
    const d = td(t);
    if (!needsReply(t) || !hasDraft(t) || !d.draft || d.edit != null || d.autoTriedFor >= (t.lastReply || 1) || blocked(t.email)) continue;
    if (kindOf(t) !== "Not interested" || words(d.draft) > 40) continue;
    if (DB && DB.doc("threads/" + t.id).acquire) { try { const lock = await DB.doc("locks/auto-" + t.id).acquire({ holder: String(ME || uid("v")), ttlMs: 600000 }); if (!lock.acquired) continue; } catch (_) { continue; } }
    await saveT(t, { autoTriedFor: t.lastReply || 1 });
    if (await sendReply(t, d.draft)) await saveT(t, { autoSent: true });
  }
}

/* ---------- boot ---------- */
(async function boot() {
  const h = (location.hash || "").slice(1); if (V[h]) S.view = h;
  render();
  const C = window.claude; if (!C || !C.use) { S.dbReady = true; render(); return; }
  const [m, d, s, u, dl, as] = await Promise.all(["mcp", "db", "sample", "user", "downloads", "assets"].map(n => Promise.resolve().then(() => C.use(n)).catch(() => null)));
  MCP = m; DB = d; SAMPLE = s; USER = u; DL = dl; ASSETS = as;
  if (!SAMPLE) S.sampleOff = "Claude drafting isn't available in this view.";
  try { ME = USER ? await USER.id() : null; } catch (_) {}
  if (DB) {
    let firstBiz = true;
    const watch = (col, key, map = x => x) => DB.collection(col).onSnapshot(snap => { S[key] = snap.docs.filter(x => x.exists).map(x => map(Object.assign({ id: x.id }, x.data()))); renderSoon(); }, () => {});
    DB.doc("settings/app").onSnapshot(doc => { S.app = doc.exists ? Object.assign({}, doc.data()) : {}; if (!S.app.schemaVersion && doc.exists) saveApp({ schemaVersion: SCHEMA_VERSION }); renderSoon(); }, () => {});
    DB.collection("businesses").onSnapshot(snap => {
      S.biz = snap.docs.filter(x => x.exists).map(x => bizDefaults(Object.assign({ id: x.id }, x.data()))).sort((a, b) => num(a.order) - num(b.order) || num(a.createdAt) - num(b.createdAt));
      if (!S.biz.find(b => b.id === S.bizId) && !(S.bizId === "all" && multi())) S.bizId = S.biz[0] ? S.biz[0].id : "";
      S.dbReady = true;
      if (firstBiz && S.biz.length) { firstBiz = false; if (!location.hash && S.app.openPage && V[S.app.openPage]) S.view = S.app.openPage; S.threads.forEach(t => t.biz = bizOf(t.mailbox, t.campaignName)); }
      renderSoon();
    }, () => { S.dbReady = true; renderSoon(); });
    DB.collection("threads").onSnapshot(snap => { const next = {}; snap.docs.forEach(x => { if (x.exists) next[x.id] = Object.assign({}, x.data()); }); for (const k in S.tdocs) if (S.tdocs[k].edit != null && next[k] && document.activeElement && document.activeElement.id === "draft-" + k) next[k].edit = S.tdocs[k].edit; S.tdocs = next; renderSoon(); }, () => {});
    watch("leads", "leads"); watch("first_emails", "fes"); watch("lead_searches", "searches"); watch("tasks", "tasks"); watch("dnc", "dnc");
    watch("meetings", "meetings"); watch("inbound", "inbound"); watch("actions", "actions"); watch("linkedin_threads", "liThreads");
    DB.collection("linkedin_stats").onSnapshot(snap => { const o = {}; snap.docs.forEach(x => { if (x.exists) o[x.id] = x.data(); }); S.linkedin = o; renderSoon(); }, () => {});
  } else { S.dbReady = true; }
  render();
  if (!MCP) return;
  await new Promise(r => setTimeout(r, 400));
  await refreshAll(false);
  setInterval(() => { if (document.visibilityState === "visible" && S.load.inbox !== "busy") { loadInbox(true).then(() => { autoWork(); autoSendPass(); }); } }, 180000);
  autoSendPass();
})();
