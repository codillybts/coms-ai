<title>COMS AI</title>
<script id="coms-config" type="application/json">{"appName":"COMS AI","brand":"#3346d3","smartleadServer":"Smartlead","templateVersion":"1.0.0"}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap">
<style>
/* Layout: fixed left rail (business switcher on top, plain-word nav, status at the bottom) + one work area. Every page opens with a title, one sentence on what it is for, and a live "what is happening" line. Cool neutrals biased toward the accent; one brand color the user can swap. Light mode only. */
:root{
  --brand:#3346d3;
  --bg:#f5f6f9; --surface:#ffffff; --surface-2:#f0f2f6; --surface-3:#e8ebf1;
  --line:#e2e5ec; --line-strong:#cfd4de;
  --fg:#11141b; --fg-2:#485062; --fg-3:#7a8293;
  --accent:var(--brand); --accent-fg:#ffffff;
  --accent-soft:color-mix(in oklab, var(--accent) 10%, transparent);
  --accent-line:color-mix(in oklab, var(--accent) 30%, transparent);
  --good:#127856; --good-soft:#e2f3eb; --warn:#9a5800; --warn-soft:#fcf0d9; --bad:#c2352a; --bad-soft:#fbe6e3; --info:#3a5a8c; --info-soft:#e6edf7;
  --shadow-1:0 1px 2px rgba(17,20,27,.05); --shadow-2:0 1px 2px rgba(17,20,27,.04), 0 8px 28px rgba(17,20,27,.08); --shadow-3:0 24px 64px rgba(17,20,27,.18);
  --scrim:rgba(17,20,27,.32);
  --f-ui:"Geist", ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --f-mono:"Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r-lg:14px; --r:10px; --r-sm:7px;
  --rail:248px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg); color:var(--fg); font-family:var(--f-ui); font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased; font-feature-settings:"ss01","cv11"}
button,input,select,textarea{font:inherit; color:inherit}
a{color:var(--accent); text-decoration:none} a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}
::selection{background:var(--accent-soft)}
h1,h2,h3{margin:0; text-wrap:balance; letter-spacing:-.018em}
.num,td.n,.mono{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono); font-size:12.5px; letter-spacing:0}
.muted{color:var(--fg-2)} .faint{color:var(--fg-3)}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}

/* ---------- shell ---------- */
.app{display:grid; grid-template-columns:var(--rail) minmax(0,1fr); height:100%}
.rail{background:var(--surface); border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0}
.biz{position:relative; padding:14px 12px 10px}
.biz-btn{width:100%; display:flex; align-items:center; gap:10px; padding:8px; border:1px solid var(--line); border-radius:var(--r); background:var(--surface); cursor:pointer; text-align:left}
.biz-btn:hover{background:var(--surface-2)}
.biz-mark{width:32px; height:32px; border-radius:8px; display:grid; place-items:center; color:#fff; font-weight:700; font-size:13px; letter-spacing:-.02em; flex:none; background:var(--brand); overflow:hidden}
.biz-mark img{width:100%; height:100%; object-fit:cover}
.biz-name{font-weight:600; font-size:14px; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.biz-sub{font-size:12px; color:var(--fg-3); line-height:1.2}
.biz-menu{position:absolute; left:12px; right:12px; top:62px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow-2); padding:6px; z-index:30}
.biz-menu button{width:100%; display:flex; align-items:center; gap:10px; padding:8px; border:0; background:none; border-radius:var(--r-sm); cursor:pointer; text-align:left}
.biz-menu button:hover{background:var(--surface-2)}
.biz-menu .biz-mark{width:26px; height:26px; font-size:11px; border-radius:6px}
.biz-menu hr{border:0; border-top:1px solid var(--line); margin:6px 2px}
.nav{flex:1; overflow:auto; padding:4px 10px 10px; display:flex; flex-direction:column; gap:1px}
.nav-h{font-size:11px; font-weight:600; color:var(--fg-3); text-transform:uppercase; letter-spacing:.07em; padding:14px 10px 6px}
.nav a{display:flex; align-items:center; gap:10px; padding:7px 10px; border-radius:var(--r-sm); color:var(--fg-2); font-weight:500; text-decoration:none}
.nav a:hover{background:var(--surface-2); color:var(--fg)}
.nav a[aria-current=page]{background:var(--accent-soft); color:var(--accent)}
.nav a .ico{width:17px; height:17px; flex:none}
.nav .count{margin-left:auto; font-size:11.5px; font-weight:600; min-width:20px; text-align:center; padding:1px 7px; border-radius:999px; background:var(--surface-3); color:var(--fg-2); font-variant-numeric:tabular-nums}
.nav .count.hot{background:var(--accent); color:var(--accent-fg)}
.rail-foot{border-top:1px solid var(--line); padding:10px 12px 12px; display:grid; gap:8px}
.conn{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--fg-2)}
.dot{width:7px; height:7px; border-radius:50%; background:var(--fg-3); flex:none}
.dot.good{background:var(--good)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)} .dot.live{background:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px transparent}}

.main{min-width:0; display:flex; flex-direction:column; min-height:0}
.topbar{display:flex; align-items:center; gap:10px; padding:10px 24px; border-bottom:1px solid var(--line); background:color-mix(in oklab, var(--bg) 85%, transparent); -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); position:sticky; top:0; z-index:10; min-height:56px}
.menu-btn{flex:none}
.rail-top{display:none}
@media (min-width:901px){ .app.rail-hidden{grid-template-columns:minmax(0,1fr)} .app.rail-hidden .rail{display:none} }
.search{flex:1; min-width:0; max-width:440px; display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:0 10px; height:36px}
.search input{border:0; background:none; outline:none; flex:1; min-width:0; height:100%}
.search .ico{width:16px; height:16px; color:var(--fg-3)}
.kbd{font-family:var(--f-mono); font-size:11px; color:var(--fg-3); border:1px solid var(--line); border-bottom-width:2px; border-radius:5px; padding:0 5px; background:var(--surface); line-height:1.5}
button.kbd{cursor:pointer} button.kbd:hover{color:var(--fg); border-color:var(--line-strong)}
.demo-flag{font-size:12px; font-weight:600; color:var(--warn); background:var(--warn-soft); padding:4px 10px; border-radius:999px; white-space:nowrap}
.scroll{flex:1; overflow:auto; min-height:0}
.page{padding:24px 24px 64px; max-width:1320px; margin:0 auto; display:grid; gap:20px; align-content:start}
.page.full{display:block; max-width:none; padding:0; height:100%}

.ph{display:flex; align-items:flex-end; gap:16px; flex-wrap:wrap}
.ph-text{flex:1 1 320px; min-width:0}
.ph h1{font-size:24px; font-weight:650; line-height:1.2}
.ph p{margin:4px 0 0; color:var(--fg-2); max-width:70ch}
.ph-acts{display:flex; gap:8px; flex-wrap:wrap}
.happening{display:flex; align-items:center; gap:10px; padding:10px 14px; border-radius:var(--r); background:var(--surface); border:1px solid var(--line); font-size:13px; color:var(--fg-2); flex-wrap:wrap}
.happening b{color:var(--fg); font-weight:600}
.happening .sep{width:1px; height:14px; background:var(--line-strong)}

/* ---------- controls ---------- */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:7px; height:34px; padding:0 13px; border-radius:var(--r-sm); border:1px solid var(--line-strong); background:var(--surface); color:var(--fg); font-weight:550; font-size:13.5px; cursor:pointer; white-space:nowrap; transition:background .12s, border-color .12s, transform .08s}
.btn:hover{background:var(--surface-2)} .btn:active{transform:translateY(1px)}
.btn .ico{width:16px; height:16px}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-fg)}
.btn.primary:hover{background:color-mix(in oklab, var(--accent) 88%, black)}
.btn.ghost{border-color:transparent; background:none; color:var(--fg-2)} .btn.ghost:hover{background:var(--surface-2); color:var(--fg)}
.btn.danger{color:var(--bad)} .btn.danger.solid{background:var(--bad); border-color:var(--bad); color:#fff}
.btn.sm{height:28px; padding:0 10px; font-size:12.5px}
.btn.lg{height:40px; padding:0 18px; font-size:14px}
.btn[disabled]{opacity:.5; cursor:not-allowed}
.icon-btn{width:34px; padding:0}
input.in,select.in,textarea.in{width:100%; background:var(--surface); border:1px solid var(--line-strong); border-radius:var(--r-sm); padding:8px 10px; outline:none; min-width:0}
input.in:focus,select.in:focus,textarea.in:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
textarea.in{resize:vertical; line-height:1.55}
select.in{appearance:none; padding-right:30px; background-image:linear-gradient(45deg,transparent 50%,var(--fg-3) 50%),linear-gradient(135deg,var(--fg-3) 50%,transparent 50%); background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%; background-size:5px 5px; background-repeat:no-repeat}
.field{display:grid; gap:6px} .field > span{font-size:12.5px; font-weight:600; color:var(--fg-2)} .field small{color:var(--fg-3); font-size:12px}
.grid-2{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr)); gap:14px}
.seg{display:inline-flex; background:var(--surface-2); border:1px solid var(--line); border-radius:var(--r-sm); padding:2px; gap:2px; flex-wrap:wrap}
.seg button{border:0; background:none; height:28px; padding:0 11px; border-radius:5px; cursor:pointer; color:var(--fg-2); font-weight:550; font-size:13px; display:inline-flex; align-items:center; gap:6px}
.seg button[aria-pressed=true]{background:var(--surface); color:var(--fg); box-shadow:var(--shadow-1)}
.seg .n{font-size:11.5px; color:var(--fg-3); font-variant-numeric:tabular-nums}
.switch{position:relative; width:36px; height:21px; flex:none; border-radius:999px; border:0; background:var(--line-strong); cursor:pointer; transition:background .15s; padding:0}
.switch::after{content:""; position:absolute; top:2.5px; left:2.5px; width:16px; height:16px; border-radius:50%; background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.25); transition:transform .15s}
.switch[aria-checked=true]{background:var(--accent)} .switch[aria-checked=true]::after{transform:translateX(15px)}
.check{width:18px; height:18px; border-radius:5px; border:1.5px solid var(--line-strong); background:var(--surface); display:inline-grid; place-items:center; cursor:pointer; flex:none; padding:0}
.check[aria-checked=true]{background:var(--accent); border-color:var(--accent)}
.check[aria-checked=true]::after{content:""; width:9px; height:5px; border:2px solid var(--accent-fg); border-top:0; border-right:0; transform:rotate(-45deg) translate(1px,-1px)}

/* ---------- surfaces ---------- */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); min-width:0}
.card-h{display:flex; align-items:center; gap:10px; padding:14px 16px 0; flex-wrap:wrap}
.card-h h2{font-size:15px; font-weight:620}
.card-h .sub{color:var(--fg-3); font-size:12.5px}
.card-h .r{margin-left:auto; display:flex; gap:6px; align-items:center}
.card-b{padding:14px 16px 16px}
.cols{display:grid; gap:20px; grid-template-columns:minmax(0,1.6fr) minmax(0,1fr); align-items:start}
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr)); gap:12px}
.kpis.four{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1180px){ .kpis.four{grid-template-columns:repeat(2,minmax(0,1fr))} }
.kpi{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); padding:14px 16px; display:grid; gap:2px; min-width:0}
.kpi .l{font-size:12.5px; color:var(--fg-2); font-weight:550}
.kpi .v{font-size:26px; font-weight:650; letter-spacing:-.025em; font-variant-numeric:tabular-nums; line-height:1.25}
.kpi .d{font-size:12px; color:var(--fg-3)}
.kpi .d.up{color:var(--good)} .kpi .d.down{color:var(--bad)}
.kpi svg{display:block; margin-top:6px; width:100%; height:28px}

.pill{display:inline-flex; align-items:center; gap:5px; height:22px; padding:0 8px; border-radius:999px; font-size:12px; font-weight:600; white-space:nowrap; background:var(--surface-3); color:var(--fg-2)}
.pill.good{background:var(--good-soft); color:var(--good)} .pill.warn{background:var(--warn-soft); color:var(--warn)} .pill.bad{background:var(--bad-soft); color:var(--bad)} .pill.info{background:var(--info-soft); color:var(--info)} .pill.accent{background:var(--accent-soft); color:var(--accent)}
.pill .dot{width:6px; height:6px}
.tag{display:inline-flex; align-items:center; height:20px; padding:0 7px; border-radius:5px; font-size:11.5px; font-weight:600; border:1px solid var(--line); color:var(--fg-2); background:var(--surface)}
.avatar{width:32px; height:32px; border-radius:50%; display:grid; place-items:center; font-weight:650; font-size:12px; flex:none; color:var(--fg); background:var(--surface-3)}

/* tables */
.tbl-wrap{overflow-x:auto; border-radius:var(--r-lg); border:1px solid var(--line); background:var(--surface)}
table{width:100%; border-collapse:collapse}
th,td{text-align:left; padding:10px 14px; border-bottom:1px solid var(--line); vertical-align:middle; white-space:nowrap}
th{font-size:12px; font-weight:600; color:var(--fg-3); background:var(--surface); position:sticky; top:0}
tbody tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer} tbody tr.click:hover td{background:var(--surface-2)}
td.wrap{white-space:normal; min-width:220px}
td .who{display:flex; align-items:center; gap:10px} td .who b{font-weight:600; display:block} td .who small{color:var(--fg-3); display:block}
.toolbar{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.toolbar .grow{flex:1}

/* list rows (home) */
.rows{display:grid}
.row{display:flex; align-items:center; gap:12px; padding:11px 16px; border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .t{flex:1; min-width:0} .row .t b{font-weight:600} .row .t div{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.row .t small{color:var(--fg-3); display:block}
.row .ic{width:30px; height:30px; border-radius:8px; display:grid; place-items:center; flex:none; background:var(--surface-2); color:var(--fg-2)}
.row .ic .ico{width:16px; height:16px}
.row .ic.accent{background:var(--accent-soft); color:var(--accent)} .row .ic.warn{background:var(--warn-soft); color:var(--warn)} .row .ic.bad{background:var(--bad-soft); color:var(--bad)} .row .ic.good{background:var(--good-soft); color:var(--good)}
.circle{width:20px; height:20px; border-radius:50%; border:1.5px solid var(--line-strong); background:none; cursor:pointer; flex:none; display:grid; place-items:center; padding:0}
.circle:hover{border-color:var(--good)}
.circle.on{background:var(--good); border-color:var(--good)}
.circle.on::after{content:""; width:8px; height:4px; border:2px solid #fff; border-top:0; border-right:0; transform:rotate(-45deg) translate(1px,-1px)}

/* setup checklist */
.steps{display:grid; gap:0}
.step{display:flex; gap:12px; align-items:flex-start; padding:10px 0}
.step .n{width:24px; height:24px; border-radius:50%; display:grid; place-items:center; font-size:12px; font-weight:700; flex:none; background:var(--surface-3); color:var(--fg-2)}
.step.done .n{background:var(--good); color:#fff}
.step.now .n{background:var(--accent); color:var(--accent-fg)}
.step b{display:block; font-weight:600} .step small{color:var(--fg-3)} .step small b{display:inline; color:var(--fg-2)}
.bar{height:6px; border-radius:999px; background:var(--surface-3); overflow:hidden}
.bar > i{display:block; height:100%; border-radius:inherit; background:var(--accent)}
.bar.good > i{background:var(--good)} .bar.warn > i{background:var(--warn)} .bar.bad > i{background:var(--bad)}

/* ---------- inbox ---------- */
.inbox{display:grid; grid-template-columns:minmax(300px,380px) minmax(0,1fr); height:100%; min-height:0}
.ib-list{border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0; background:var(--surface)}
.ib-head{padding:16px 16px 10px; display:grid; gap:10px; border-bottom:1px solid var(--line)}
.ib-head h1{font-size:20px; font-weight:650}
.ib-head p{margin:0; color:var(--fg-2); font-size:13px}
.ib-items{overflow:auto; flex:1}
.ib-item{display:grid; gap:3px; padding:12px 16px; border-bottom:1px solid var(--line); cursor:pointer; position:relative; border-left:3px solid transparent}
.ib-item:hover{background:var(--surface-2)}
.ib-item[aria-selected=true]{background:var(--accent-soft); border-left-color:var(--accent)}
.ib-item .top{display:flex; align-items:center; gap:8px}
.ib-item .top b{font-weight:620; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.ib-item .top .time{margin-left:auto; color:var(--fg-3); font-size:12px; white-space:nowrap}
.ib-item .sub{font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.ib-item .pre{font-size:12.5px; color:var(--fg-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.ib-item .meta{display:flex; gap:6px; margin-top:4px; flex-wrap:wrap}
.ib-item.unread .top b::before{content:""; display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--accent); margin-right:7px; vertical-align:1px}
.thread{display:flex; flex-direction:column; min-height:0; min-width:0}
.th-head{padding:14px 24px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; flex-wrap:wrap; background:var(--surface)}
.th-head h2{font-size:17px; font-weight:640}
.th-head .r{margin-left:auto; display:flex; gap:6px; flex-wrap:wrap}
.th-body{flex:1; overflow:auto; padding:20px 24px 40px; display:grid; gap:16px; align-content:start}
.th-grid{display:grid; grid-template-columns:minmax(0,1fr) 260px; gap:20px; align-items:start}
.msg{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); padding:14px 16px; display:grid; gap:8px}
.msg.ours{background:var(--surface-2)}
.msg .mh{display:flex; align-items:center; gap:10px; font-size:13px}
.msg .mh b{font-weight:600} .msg .mh .time{margin-left:auto; color:var(--fg-3); font-size:12px}
.msg .mb{white-space:pre-wrap; font-size:14px; line-height:1.6; max-width:72ch}
.draft{border:1.5px solid var(--accent-line); border-radius:var(--r-lg); background:var(--surface); overflow:hidden}
.draft-h{display:flex; align-items:center; gap:8px; padding:10px 14px; background:var(--accent-soft); font-size:13px; flex-wrap:wrap}
.draft-h b{color:var(--accent); font-weight:650}
.draft textarea{border:0; width:100%; min-height:170px; padding:14px 16px; outline:none; resize:vertical; background:transparent; line-height:1.6; font-size:14px}
.draft-checks{display:flex; gap:6px; flex-wrap:wrap; padding:0 14px 10px}
.draft-foot{display:flex; align-items:center; gap:8px; padding:10px 14px; border-top:1px solid var(--line); flex-wrap:wrap}
.draft-foot .from{font-size:12.5px; color:var(--fg-3); margin-right:auto}
.confirm{display:flex; align-items:center; gap:10px; padding:10px 14px; background:var(--warn-soft); border-top:1px solid var(--line); flex-wrap:wrap; font-size:13px}
.confirm b{color:var(--fg)}
.side-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); padding:14px; display:grid; gap:10px; font-size:13px}
.side-card h3{font-size:13px; font-weight:620}
.kv{display:grid; grid-template-columns:auto 1fr; gap:6px 12px} .kv dt{color:var(--fg-3)} .kv dd{margin:0; text-align:right; font-weight:550; min-width:0; overflow:hidden; text-overflow:ellipsis}
.empty{display:grid; place-items:center; text-align:center; gap:6px; padding:48px 20px; color:var(--fg-2)}
.empty b{color:var(--fg); font-size:15px}
.empty .ico{width:28px; height:28px; color:var(--fg-3)}

/* pipeline */
.board{display:grid; grid-auto-flow:column; grid-auto-columns:minmax(240px,1fr); gap:12px; overflow-x:auto; padding-bottom:6px}
.col{background:var(--surface-2); border-radius:var(--r-lg); padding:10px; display:grid; gap:8px; align-content:start; min-height:240px}
.col-h{display:flex; align-items:center; gap:8px; padding:2px 4px 4px}
.col-h b{font-weight:620} .col-h .sum{margin-left:auto; font-size:12px; color:var(--fg-3); font-variant-numeric:tabular-nums}
.col-h i{width:8px; height:8px; border-radius:50%}
.deal{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:10px 12px; display:grid; gap:4px; cursor:grab; box-shadow:var(--shadow-1)}

    const sr = stage.getBoundingClientRect();
    const W = 975, H = Math.round(Math.min(1500, Math.max(420, W * (sr.height || 610) / (sr.width || W))));
    const path = d3.geoPath();
    const byState = d3.rollup(leads, v=>v.length, d=>d.state), byCounty = d3.rollup(leads, v=>v.length, d=>d.county);
    const maxState = d3.max(byState.values()) || 1;
    const tint = d3.interpolateLab("#eef1fb", brand);
    const stateFill = d => terr.has(d.id) ? tint(.12 + .78*Math.sqrt((byState.get(d.id)||0)/maxState)) : "#e8ebf1";
    const newHex = d3.color(brand).darker(1.15).formatHex();
    const statusHex = s => s==="New" ? newHex : STATUS.find(x=>x.id===s).hex;

    stage.innerHTML = `
      <svg class="mv-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Map of your territory">
        <defs>
          <filter id="mv-lift" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2.2" stdDeviation="2.6" flood-color="${brand}" flood-opacity=".28"/></filter>
          <radialGradient id="mv-glow"><stop offset="0" stop-color="${brand}" stop-opacity=".35"/><stop offset="1" stop-color="${brand}" stop-opacity="0"/></radialGradient>
          <pattern id="mv-grid" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#c9cfdb" opacity=".55"/></pattern>
        </defs>
        <rect width="${W}" height="${H}" fill="url(#mv-grid)"/>
        <g class="mv-zoom">
          <g class="mv-states-base"></g>
          <g class="mv-terr" filter="url(#mv-lift)"></g>
          <g class="mv-counties"></g>
          <g class="mv-borders"></g>
          <g class="mv-labels"></g>
          <g class="mv-dots"></g>
          <g class="mv-fresh"></g>
        </g>
      </svg>
      <div class="mv-crumbs"></div>
      <div class="mv-tip" hidden></div>
      <div class="mv-pop" hidden></div>
      <div class="mv-tools">
        <button class="btn icon-btn sm" data-mv="zin" aria-label="Zoom in">+</button>
        <button class="btn icon-btn sm" data-mv="zout" aria-label="Zoom out">−</button>
        <button class="btn sm" data-mv="reset">Whole territory</button>
      </div>
      <div class="mv-hint">Scroll or pinch to zoom · Click a state, county or lead</div>`;
    const svg = d3.select(stage).select("svg"), gz = svg.select(".mv-zoom");
    const tip = stage.querySelector(".mv-tip"), pop = stage.querySelector(".mv-pop");

    gz.select(".mv-states-base").selectAll("path").data(states).join("path")
      .attr("class", d => "mv-state" + (terr.has(d.id) ? " in" : "")).attr("d", path).attr("fill", stateFill);
    gz.select(".mv-terr").selectAll("path").data(states.filter(d => terr.has(d.id))).join("path")
      .attr("class","mv-state in lifted").attr("d", path).attr("fill", stateFill);
    gz.select(".mv-borders").append("path").attr("class","mv-border").attr("d", path(topojson.mesh(topo, topo.objects.states, (a,b)=>a!==b)));
    gz.select(".mv-labels").selectAll("text").data(states.filter(d => terr.has(d.id))).join("text")
      .attr("class","mv-label").attr("transform", d => `translate(${path.centroid(d)})`).text(d => POSTAL[d.id]||"");

    let k = 1, delaunay = null, visible = [];
    function drawCounties(){
      const g = gz.select(".mv-counties");
      if(st.level === "us"){ g.selectAll("path").remove(); return; }
      const list = counties.filter(c => c.id.slice(0,2) === st.state);
      const mx = d3.max(list, c => byCounty.get(c.id)||0) || 1;
      g.selectAll("path").data(list, d=>d.id).join("path")
        .attr("class", d => "mv-county" + (st.county===d.id?" on":"") + (T.counties && T.counties.includes(d.id) ? " in" : ""))
        .attr("d", path)
        .attr("fill", d => { const n = byCounty.get(d.id)||0; return n ? tint(.1 + .8*Math.sqrt(n/mx)) : "#f4f6f9"; })
        .attr("opacity", d => st.level==="county" && st.county!==d.id ? .55 : 1);
    }
    function inScope(d){ return st.level==="us" ? true : st.level==="state" ? d.state===st.state : d.county===st.county; }
    function drawDots(){
      visible = leads.filter(d => st.filter.has(d.status));
      const g = gz.select(".mv-dots");
      if(st.mode === "density"){ g.selectAll("*").remove(); delaunay = null; return; }
      const u = (svg.node().getScreenCTM() || {a:1}).a || 1, px = 1/(k*u);
      const r = (st.level==="us" ? 3.2 : st.level==="state" ? 4.6 : 6) * px;
      g.selectAll("circle.mv-dot").data(visible, d=>d.id).join(
        enter => enter.append("circle").attr("class","mv-dot").attr("cx",d=>d.x).attr("cy",d=>d.y)
      ).attr("r", d => (st.sel===d.id ? r*1.9 : r))
       .attr("fill", d => statusHex(d.status))
       .attr("stroke-width", 1.1*px)
       .attr("opacity", d => inScope(d) ? (d.approx ? .55 : .95) : .18)
       .classed("sel", d => st.sel===d.id);
      const hot = visible.filter(d => (d.status==="Interested"||d.status==="Won") && inScope(d));
      g.selectAll("circle.mv-ping").data(hot, d=>d.id).join("circle").attr("class","mv-ping")
        .attr("cx",d=>d.x).attr("cy",d=>d.y).attr("r", r*1.6).attr("stroke", d => statusHex(d.status)).attr("stroke-width", 1.4*px);
      const sel = visible.find(d => d.id===st.sel);
      g.selectAll("circle.mv-selring").data(sel ? [sel] : [], d=>d.id).join("circle").attr("class","mv-selring")
        .attr("cx",d=>d.x).attr("cy",d=>d.y).attr("r", r*3.4).attr("stroke-width", 2*px);
      delaunay = d3.Delaunay.from(visible, d=>d.x, d=>d.y);
    }
    function sizeToZoom(){
      const u = (svg.node().getScreenCTM() || {a:1}).a || 1;
      gz.selectAll(".mv-label").attr("font-size", 12/(k*u)).attr("opacity", st.level==="us" ? 1 : 0);
      drawDots();
      positionPop();
    }

    const zoom = d3.zoom().scaleExtent([1, 60]).translateExtent([[-200,-200],[W+200,H+200]])
      .on("zoom", e => { st.t = e.transform; k = e.transform.k; gz.attr("transform", e.transform); sizeToZoom(); hideTip(); });
    svg.call(zoom).on("dblclick.zoom", null);
    function fit(bounds, animate=true){
      const [[x0,y0],[x1,y1]] = bounds, kk = Math.min(60, .86/Math.max((x1-x0)/W, (y1-y0)/H));
      const t = d3.zoomIdentity.translate(W/2 - kk*(x0+x1)/2, H/2 - kk*(y0+y1)/2).scale(kk);
      (animate && !matchMedia("(prefers-reduced-motion:reduce)").matches ? svg.transition().duration(850).ease(d3.easeCubicInOut) : svg).call(zoom.transform, t);
    }
    function terrBounds(){ const fc = { type:"FeatureCollection", features: T.counties && T.counties.length ? counties.filter(c=>T.counties.includes(c.id)) : states.filter(d=>terr.has(d.id)) }; return path.bounds(fc); }
    function goLevel(level, id, animate=true){
      st.sel = null; hidePop();
      if(level==="us"){ st.level = "us"; st.state = null; st.county = null; fit(terrBounds(), animate); if(T.states.length===1){ st.level="us"; } }
      if(level==="state"){ st.level = "state"; st.state = id; st.county = null; fit(T.counties && T.counties.length && T.states.length===1 && id===T.states[0] ? terrBounds() : path.bounds(states.find(s=>s.id===id)), animate); }
      if(level==="county"){ st.level = "county"; st.county = id; st.state = id.slice(0,2); fit(path.bounds(counties.find(c=>c.id===id)), animate); }
      gz.selectAll(".mv-state").classed("dim", d => st.level!=="us" && d.id!==st.state).classed("cur", d => d.id===st.state);
      drawCounties(); drawDots(); renderPanel(); renderCrumbs();
    }

    /* hover + click with nearest-lead picking */
    function nearest(e){
      if(!delaunay || !visible.length) return null;
      const [px, py] = d3.pointer(e, svg.node()), t = st.t || d3.zoomIdentity;
      const [mx, my] = t.invert([px, py]); const i = delaunay.find(mx, my); const d = visible[i];
      if(!d) return null;
      const dist = Math.hypot(d.x-mx, d.y-my) * t.k;
      const unit = svg.node().getScreenCTM().a; // viewBox units to screen px
      return dist*unit <= 11 ? d : null;
    }
    function areaAt(e){
      const el = e.target.closest ? e.target.closest(".mv-county, .mv-state") : null;
      return el ? d3.select(el).datum() : null;
    }
    function showTip(e, html){ const r = stage.getBoundingClientRect(); tip.innerHTML = html; tip.hidden = false; tip.style.left = (e.clientX - r.left + 14) + "px"; tip.style.top = (e.clientY - r.top + 14) + "px"; }
    function hideTip(){ tip.hidden = true; }
    svg.on("pointermove", e => {
      const d = nearest(e);
      svg.classed("hand", !!d);
      gz.selectAll("circle.mv-dot").classed("hov", x => d && x.id===d.id);
      if(d){ showTip(e, `<b>${esc(d.name)}</b><span>${esc(d.company)} · ${esc(d.status)}</span>`); return; }
      const a = areaAt(e);
      if(!a){ hideTip(); return; }
      if(a.id.length===2) showTip(e, `<b>${esc(a.properties.name)}</b><span>${terr.has(a.id)?`${(byState.get(a.id)||0).toLocaleString()} leads`:"Outside your territory"}</span>`);
      else showTip(e, `<b>${esc(a.properties.name)} County</b><span>${(byCounty.get(a.id)||0).toLocaleString()} leads</span>`);
    }).on("pointerleave", () => { hideTip(); gz.selectAll("circle.mv-dot").classed("hov", false); });
    svg.on("click", e => {
      if(e.defaultPrevented) return;
      const d = nearest(e);
      if(d){ selectLead(d, false); return; }
      const a = areaAt(e);
      if(!a){ return; }
      if(a.id.length===2){ if(st.level==="us" || st.state!==a.id) goLevel("state", a.id); }
      else if(st.county!==a.id) goLevel("county", a.id);
    });

    function selectLead(d, fly){
      st.sel = d.id; drawDots();
      if(fly){ const pad = 4; fit([[d.x-pad,d.y-pad*.65],[d.x+pad,d.y+pad*.65]]); }
      showPop(d);
      panel.querySelectorAll("[data-lead]").forEach(b => b.setAttribute("aria-current", b.dataset.lead===d.id));
    }
    function popHtml(d){
      const pill = `<span class="pill" style="background:color-mix(in oklab, ${statusHex(d.status)} 14%, transparent);color:${statusHex(d.status)}">${esc(d.status)}</span>`;
      const html = `<button class="btn ghost icon-btn sm mv-x" data-mv="close" aria-label="Close">×</button>
        <div class="mv-pop-h"><span class="avatar">${esc(String(d.name||"?").split(" ").map(w=>w[0]||"").join("").slice(0,2))}</span><div><b>${esc(d.name)}</b><small>${esc(d.title)}, ${esc(d.company)}</small></div></div>
        <dl class="kv"><dt>Status</dt><dd>${pill}</dd><dt>Where</dt><dd>${esc(d.city)} · ${esc(d.countyName)} Co.</dd><dt>Email</dt><dd class="mono">${d.email?esc(d.email):'<span class="faint">None published</span>'}</dd>${d.email?`<dt>Found on</dt><dd>${esc(d.src)}</dd>`:""}<dt>Fit</dt><dd>${d.fit} / 100</dd><dt>Deal value</dt><dd>${money(d.value)}</dd></dl>
        <div class="mv-pop-f">${d.status==="New"&&d.email?`<button class="btn primary sm" data-mv="fe">Write first email</button>`:""}${d.status==="Replied"||d.status==="Interested"?`<button class="btn primary sm" data-mv="inbox">Open conversation</button>`:""}${opts.onLead?`<button class="btn sm" data-mv="open">Details</button>`:""}<button class="btn sm" data-mv="zoomlead">Zoom here</button></div>`;
      return html;
    }
    function showPop(d){ st.sel = d.id; renderPanel(); panel.scrollTop = 0; }
    function hidePop(){ if(st.sel){ st.sel = null; renderPanel(); } }
    function positionPop(){ /* the card is docked top-right; the selected lead gets a ring instead */ }

    /* panel */
    function scopeLeads(){ return leads.filter(inScope); }
    function areaName(){ if(st.level==="county"){ const c = counties.find(x=>x.id===st.county); return c.properties.name + " County"; } if(st.level==="state"){ return states.find(s=>s.id===st.state).properties.name; } return T.label; }
    function renderCrumbs(){
      const c = stage.querySelector(".mv-crumbs");
      const parts = [`<button data-mv="us">${T.states.length===1?"Territory":"United States"}</button>`];
      if(st.state) parts.push(`<button data-mv="state" data-id="${st.state}">${esc(states.find(s=>s.id===st.state).properties.name)}</button>`);
      if(st.county) parts.push(`<span>${esc(counties.find(x=>x.id===st.county).properties.name)} County</span>`);
      c.innerHTML = parts.join('<i>›</i>');
    }
    function renderPanel(){
      const L = scopeLeads(), inT = st.level==="us" || terr.has(st.state);
      const count = s => L.filter(d=>d.status===s).length;
      const withEmail = L.filter(d=>d.email).length, open = L.filter(d=>d.status==="Interested"||d.status==="Replied");
      const pipe = L.filter(d=>d.status==="Interested").reduce((a,d)=>a+d.value,0);
      const top = L.filter(d=>st.filter.has(d.status)).sort((a,b)=>b.fit-a.fit).slice(0,7);
      const newWithEmail = L.filter(d=>d.status==="New"&&d.email).length;
      const selLead = st.sel ? leads.find(x=>x.id===st.sel) : null;
      panel.innerHTML = `${selLead ? `<div class="mv-selcard">${popHtml(selLead)}</div>` : ""}
        <div class="mv-ph"><span class="eyebrow">${st.level==="us"?"Your territory":st.level==="state"?"State view":"County view"}</span><h2>${esc(areaName())}</h2>
          <p>${opts.unplaced && st.level==="us" ? `<span class="faint">${opts.unplaced.toLocaleString()} more without a published address aren't on the map. </span>` : ""}${inT ? `${L.length.toLocaleString()} leads${st.level==="us"?` across ${T.states.length} ${T.states.length===1?"state":"states"}`:""}` : "Outside your territory. Ask Claude to add it if you want leads here."}</p></div>
        <div class="mv-stats">
          <div><b>${L.length.toLocaleString()}</b><span>Leads</span></div>
          <div><b>${L.length?Math.round(withEmail/L.length*100):0}%</b><span>Published email</span></div>
          <div><b>${open.length}</b><span>In conversation</span></div>
          <div><b>${money(pipe)}</b><span>Interested pipeline</span></div>
        </div>
        <div class="mv-sec"><div class="mv-sec-h"><b>Show</b><div class="seg">${[["dots","Leads"],["density","Density"]].map(([v,l])=>`<button data-mv="mode" data-v="${v}" aria-pressed="${st.mode===v}">${l}</button>`).join("")}</div></div>
          <div class="mv-legend">${STATUS.map(s=>`<button data-mv="filter" data-v="${s.id}" aria-pressed="${st.filter.has(s.id)}"><i style="background:${statusHex(s.id)}"></i>${s.id}<span>${count(s.id).toLocaleString()}</span></button>`).join("")}</div></div>
        <div class="mv-sec mv-acts">
          <button class="btn primary sm" data-mv="find">Find leads here</button>
          ${newWithEmail?`<button class="btn sm" data-mv="feall">Write first emails (${newWithEmail})</button>`:""}
        </div>
        <div class="mv-sec"><div class="mv-sec-h"><b>Best fits here</b><span class="faint">by fit score</span></div>
          <div class="mv-list">${top.map(d=>`<button data-mv="lead" data-lead="${esc(d.id)}" aria-current="${st.sel===d.id}"><i style="background:${statusHex(d.status)}"></i><span><b>${esc(d.company)}</b><small>${esc(d.name)} · ${esc(d.city)}</small></span><em>${d.fit}</em></button>`).join("") || '<p class="faint" style="margin:0">No leads match these filters.</p>'}</div></div>
        ${opts.live ? `<div class="mv-sec"><div class="mv-sec-h"><b><span class="dot live"></span> Lead search running</b></div><div class="mv-feed">${feed.map(f=>`<div><b>${esc(f.company)}</b><small>${esc(f.city)} · just now</small></div>`).join("") || '<small class="faint">New leads appear on the map as agents find them.</small>'}</div></div>` : ""}`;
    }
    function renderCrumbsAndPanel(){ renderCrumbs(); renderPanel(); }

    /* live drops while a lead search runs */
    const feed = [];
    

    /* panel + tool clicks */
    el.onclick = e => {
      const b = e.target.closest("[data-mv]"); if(!b) return;
      const a = b.dataset.mv;
      if(a==="us") goLevel("us");
      else if(a==="state") goLevel("state", b.dataset.id);
      else if(a==="zin") svg.transition().duration(300).call(zoom.scaleBy, 1.6);
      else if(a==="zout") svg.transition().duration(300).call(zoom.scaleBy, 1/1.6);
      else if(a==="reset") goLevel(T.states.length===1 ? "state" : "us", T.states[0]);
      else if(a==="mode"){ st.mode = b.dataset.v; drawDots(); gz.select(".mv-counties").classed("density", st.mode==="density"); renderPanel(); }
      else if(a==="filter"){ const v = b.dataset.v; st.filter.has(v) ? st.filter.delete(v) : st.filter.add(v); if(!st.filter.size) st.filter.add(v); drawDots(); renderPanel(); }
      else if(a==="lead"){ const d = leads.find(x=>x.id===b.dataset.lead); if(d) selectLead(d, true); }
      else if(a==="close"){ hidePop(); drawDots(); }
      else if(a==="zoomlead"){ const d = leads.find(x=>x.id===st.sel); if(d) selectLead(d, true); }
      else if(a==="find") opts.onFind(areaName());
      else if(a==="fe"){ if(opts.onWrite) opts.onWrite([st.sel]); else opts.toast("Claude is writing it. It appears in First emails for your approval.", "spark"); }
      else if(a==="open"){ if(opts.onLead) opts.onLead(st.sel); }
      else if(a==="feall"){ const ids = scopeLeads().filter(d=>d.status==="New"&&d.email).map(d=>d.id); if(opts.onWrite){ opts.onWrite(ids); return; } const n = ids.length; opts.toast(`Claude is writing ${n} first emails for ${areaName()}. They appear in First emails for your approval.`, "spark"); }
      else if(a==="inbox") opts.onInbox();
    };
    stage.onkeydown = e => { if(e.key==="Escape"){ if(st.sel){ hidePop(); drawDots(); } else if(st.level==="county") goLevel("state", st.state); else if(st.level==="state" && T.states.length>1) goLevel("us"); } };

    /* first paint: restore or open on the territory */
    gz.selectAll(".mv-state").classed("dim", d => st.level!=="us" && d.id!==st.state).classed("cur", d => d.id===st.state);
    drawCounties(); renderCrumbsAndPanel();
    if(st.t){ svg.call(zoom.transform, st.t); }
    else if(st.level==="us") fit(terrBounds(), false);
    else if(st.level==="state") fit(T.counties && T.counties.length && st.state===T.states[0] ? terrBounds() : path.bounds(states.find(s=>s.id===st.state)), false);
    else fit(path.bounds(counties.find(c=>c.id===st.county)), false);
    sizeToZoom();
  }

  return { mount };
})();
</script>
<script>
/* Icon set shared with the approved design. */
const P = {
  home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/>',

  send:'<path d="M21 3 10 14"/><path d="M21 3l-7 18-4-7-7-4z"/>',
  pen:'<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>',
  board:'<rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="10" rx="1.5"/><rect x="17" y="4" width="4" height="13" rx="1.5"/>',
  contact:'<rect x="4" y="3" width="16" height="18" rx="2"/><circle cx="12" cy="10" r="3"/><path d="M7.5 17c.9-2 2.5-3 4.5-3s3.6 1 4.5 3"/>',
  tasks:'<rect x="3.5" y="3.5" width="17" height="17" rx="3"/><path d="m8 12 3 3 5-6"/>',
  chart:'<path d="M3 20h18"/><path d="M6 16v-5M11 16V6M16 16v-8M21 16v-3"/>',
  mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 6.5 8.5 6 8.5-6"/>',
  ban:'<circle cx="12" cy="12" r="9"/><path d="m5.6 5.6 12.8 12.8"/>',
  spark:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 15l.7 1.8 1.8.7-1.8.7L19 20l-.7-1.8-1.8-.7 1.8-.7z"/>',
  li:'<rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 10.5V17M8 7.2v.01M12 17v-6.5M12 13.5a2.5 2.5 0 0 1 5 0V17"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',

      ${S.biz.map(x => `<button role="menuitemradio" aria-checked="${x.id === S.bizId}" data-act="biz" data-id="${esc(x.id)}">${mark(x)}<span style="flex:1;min-width:0"><div class="biz-name" style="font-size:13px">${esc(x.name)}</div><div class="biz-sub">${esc(x.sub)}</div></span>${x.id === S.bizId ? I("check") : ""}</button>`).join("")}

V.home = () => {
  const b = B(), th = allThreads(), c = counts(), acc = scopeAccounts();

  if (b && b.inbound.on) scopeList(S.inbound).filter(x => x.status === "new").forEach(x => needs.push({ id: "in-" + x.id, ic: "download", tone: "accent", t: `<b>${esc(x.name || x.email)}</b> came in through ${esc(x.source || "inbound")}`, s: ago(ts(x.receivedAt)), go: "inbound", btn: "Reply" }));
  const nd = nudgeList().filter(n => n.due); if (nd.length) needs.push({ id: "nudges", ic: "bell", tone: "warn", t: `<b>${nd.length} nudge${nd.length === 1 ? "" : "s"} due</b> for interested leads who went quiet`, s: "Claude drafts each one", go: "inbox", tab: "nudges", btn: "Open nudges" });
  if (c.fe) needs.push({ id: "fe", ic: "pen", tone: "", t: `<b>${c.fe} first email${c.fe === 1 ? "" : "s"}</b> waiting for your approval`, s: "Nothing is sent until you approve", go: "firstemails", btn: "Review" });
  scopeList(S.meetings).filter(m => new Date(ts(m.start)).toDateString() === new Date().toDateString()).forEach(m => needs.push({ id: "mt-" + m.id, ic: "cal", tone: "", t: `Meeting with <b>${esc(m.name)}</b> at ${new Date(ts(m.start)).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" })}`, s: m.prep ? "Prep note ready" : (m.what || ""), go: "calendar", btn: "Open" }));
  acc.filter(m => m.status === "Disconnected" || m.status === "Check").forEach(m => needs.push({ id: "m-" + m.email, ic: "alert", tone: m.status === "Disconnected" ? "bad" : "warn", t: `<b>${esc(m.email)}</b> ${m.status === "Disconnected" ? "is disconnected" : "warmup health is " + m.health + "%"}`, s: m.status === "Disconnected" ? "Reconnect it in Smartlead" : "Lower its daily limit until it recovers", go: "mailboxes", btn: "Open" }));
  scopeList(S.tasks).filter(t => !t.done && t.due && t.due < Date.now() + 3600000 && !t.threadId).forEach(t => needs.push({ id: "tk-" + t.id, ic: "tasks", tone: "", t: esc(t.t), s: "Task due", go: "tasks", btn: "Open" }));
  const open = needs.filter(n => !S.homeDone.has(n.id));
  const st = S.stats || {}, days = S.day || [], sent7 = days.slice(-7).reduce((a, d) => a + d.sent, 0), rep7 = days.slice(-7).reduce((a, d) => a + d.replied, 0);
  const positive = Object.values(S.tdocs).filter(d => inScope(d.biz) && POSITIVE.has(d.kind)).length;
  const deals = th.filter(t => td(t).stage || POSITIVE.has(kindOf(t))), openDeals = deals.filter(t => !["Won", "Lost"].includes(stageOf(t)));
  const warming = acc.filter(m => m.status === "Warming"), active = S.campaigns.filter(x => inScope(x.biz) && String(x.status).toUpperCase() === "ACTIVE").length;
  const steps = [
    ["Business profile and voice", b && b.profile && b.profile.offer ? "Answered in setup" : "Ask Claude to finish setup", !!(b && b.profile && b.profile.offer)],
    ["Smartlead connected", S.load.accounts === "ok" ? "Replies and campaigns sync here" : S.err.conn ? "Not reachable yet" : "Checking…", S.load.accounts === "ok"],
    [`${acc.length} mailbox${acc.length === 1 ? "" : "es"}`, warming.length ? `${warming.length} warming: day ${Math.min(...warming.map(m => m.day))} of about 18` : acc.length ? "Ready to send" : "Add mailboxes to send", acc.length > 0 && !warming.length, warming.length > 0],
    ["First leads", scopeList(S.leads).length ? `${scopeList(S.leads).length} leads saved` : "Import a list or run a lead search", scopeList(S.leads).length > 0],
    ["First campaign live", active ? `${active} sending` : "Approve first emails, then launch", active > 0]];
  const running = scopeList(S.searches).find(s => s.status === "running");
  return `<div class="page">
    ${head(`${greeting()}${b && b.sender ? ", " + esc(b.sender.split(" ")[0]) : ""}`, "What needs you today, and how your outbound is going.", `<button class="btn" data-act="find-leads">${I("radar")}Find leads</button><button class="btn primary" data-nav="inbox">${I("inbox")}Open inbox${c.inbox ? ` (${c.inbox})` : ""}</button>`)}
    ${connBanner()}
    ${happening([`<span class="dot ${connState().dot}"></span><b>${connState().text}</b>`, acc.length ? `${acc.filter(m => m.status === "Ready").length} of ${acc.length} mailboxes ready` : "", running ? `<span class="dot live"></span>Lead search running: <b>${num(running.found)}</b> found` : "", S.lastSync ? `Synced ${ago(S.lastSync)}` : ""])}
    <div class="kpis">
      <div class="kpi"><span class="l">Emails sent, 7 days</span><span class="v">${fmt(sent7)}</span><span class="d">${active} active campaign${active === 1 ? "" : "s"}</span>${days.length ? spark(days.map(d => d.sent)) : ""}</div>
      <div class="kpi"><span class="l">Reply rate, 7 days</span><span class="v">${pct(rep7, sent7)}</span><span class="d">${fmt(rep7)} replies</span>${days.length ? spark(days.map(d => d.replied), "var(--good)") : ""}</div>
      <div class="kpi"><span class="l">Positive replies</span><span class="v">${positive}</span><span class="d">Interested, questions, referrals</span></div>
      <div class="kpi"><span class="l">Open pipeline</span><span class="v">${money(openDeals.reduce((a, t) => a + num(td(t).value), 0))}</span><span class="d">${openDeals.length} open deals</span></div>
    </div>
    <div class="cols">
      <section class="card"><div class="card-h"><h2>Needs you now</h2><span class="sub">${open.length} open · tick a row when it's handled</span>${S.homeDone.size ? `<span class="r"><button class="btn ghost sm" data-act="home-undo">Show checked off</button></span>` : ""}</div>
        <div class="card-b" style="padding:8px 0 4px">${open.length ? `<div class="rows">${open.map(n => `<div class="row"><button class="circle" data-act="home-done" data-id="${esc(n.id)}" aria-label="Mark handled"></button><span class="ic ${n.tone}">${I(n.ic)}</span><span class="t"><div>${n.t}</div><small>${esc(n.s)}</small></span><button class="btn sm" data-nav="${n.go}" ${n.sel ? `data-sel="${esc(n.sel)}"` : ""} ${n.tab ? `data-tab="${n.tab}"` : ""}>${n.btn}</button></div>`).join("")}</div>` : empty("check", "You're all caught up", "New replies and approvals show up here.")}</div></section>
      <div style="display:grid;gap:20px">
        <section class="card"><div class="card-h"><h2>Setup</h2><span class="sub">${steps.filter(s => s[2]).length} of ${steps.length} done</span></div><div class="card-b" style="padding-top:6px"><div class="steps">
          ${steps.map((s, i) => `<div class="step ${s[2] ? "done" : s[3] ? "now" : ""}"><span class="n">${s[2] ? I("check").replace('class="ico"', 'class="ico" style="width:13px;height:13px;stroke-width:3"') : i + 1}</span><span><b>${s[0]}</b><small>${s[1]}</small></span></div>`).join("")}</div></div></section>
        <section class="card"><div class="card-h"><h2>Lead searches</h2><span class="r"><button class="btn sm" data-act="find-leads">${I("plus")}New</button></span></div>
          <div class="card-b" style="padding:8px 0 4px">${scopeList(S.searches).length ? `<div class="rows">${scopeList(S.searches).slice(0, 5).map(s => `<div class="row"><span class="ic ${s.status === "running" ? "accent" : s.status === "done" ? "good" : ""}">${I(s.status === "done" ? "check" : s.status === "running" ? "radar" : "clock")}</span><span class="t"><div><b>${esc(s.name || s.who)}</b></div><small>${s.status === "queued" ? 'Queued · say "run my lead searches" in Claude' : `${num(s.found)} found · ${num(s.withEmail)} with a published email`}</small></span>${pill(s.status === "running" ? "Running" : s.status === "done" ? "Done" : "Queued", s.status === "running" ? "accent" : s.status === "done" ? "good" : "")}</div>`).join("")}</div>` : empty("radar", "No searches yet", "Describe who you want and Claude's agents look for them.", `<button class="btn primary sm" data-act="find-leads">${I("radar")}Find leads</button>`)}</div></section>
      </div>
    </div></div>`;
};
function greeting() { const h = new Date().getHours(); return h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening"; }

V.inbox = () => {
  const ib = S.ib, th = allThreads();
  const groups = { reply: needsReply, interested: t => POSITIVE.has(kindOf(t)), done: isDone };
  const list = ib.tab === "replies" ? th.filter(groups[ib.filter]) : [];
  const nudges = nudgeList();
  const wide = !matchMedia("(max-width:900px)").matches;
  if (ib.tab === "replies" && wide && list.length && !list.some(x => x.id === ib.sel)) { ib.sel = list[0].id; ib.confirm = false; }
  if (ib.tab === "nudges" && wide && nudges.length && !nudges.some(n => n.t.id === ib.sel)) { ib.sel = nudges[0].t.id; ib.confirm = false; }
  if (ib.tab === "sent" && wide && S.sent.length && !S.sent.some(x => x.id === ib.sel)) { ib.sel = S.sent[0].id; ib.confirm = false; }
  let items = "";
  if (ib.tab === "nudges") items = nudges.length ? nudges.map(n => `<div class="ib-item" data-act="thread" data-id="${esc(n.t.id)}" aria-selected="${ib.sel === n.t.id}"><div class="top"><b>${esc(n.t.name)}</b><span class="time">${n.quiet} days quiet</span></div><div class="sub">${esc(n.t.company || n.t.email)}</div><div class="meta">${pill(n.label, n.due ? "warn" : "")}</div></div>`).join("") : empty("bell", "No nudges", "Interested leads who go quiet after your reply show up here.");
  else if (ib.tab === "sent") items = S.load.sent === "busy" && !S.sent.length ? loadingRow("sent emails") : S.err.sent ? empty("alert", "Couldn't load Sent", esc(S.err.sent)) : S.sent.length ? S.sent.filter(t => inScope(t.biz)).map(t => `<div class="ib-item" data-act="thread" data-id="${esc(t.id)}" aria-selected="${ib.sel === t.id}"><div class="top"><b>${esc(t.name)}</b><span class="time">${esc(timeShort(t.lastSent))}</span></div><div class="sub">${esc(t.subject)}</div><div class="pre">${esc(t.campaignName)}</div></div>`).join("") : empty("send", "Nothing sent yet", "Emails your campaigns send show up here.");
  else items = !MCP ? empty("inbox", "Open this page on claude.ai", "Replies load from Smartlead there.") : S.load.inbox === "busy" && !S.threads.length ? loadingRow("replies") : S.err.inbox && !S.threads.length ? empty("alert", "Couldn't load replies", esc(S.err.inbox)) : list.length ? list.map(t => `<div class="ib-item ${t.unread ? "unread" : ""}" data-act="thread" data-id="${esc(t.id)}" aria-selected="${ib.sel === t.id}" tabindex="0">
      <div class="top"><b>${esc(t.name)}</b><span class="time">${esc(timeShort(t.lastReply || t.lastSent))}</span></div>
      <div class="sub">${esc(t.company ? t.company + " · " : "")}${esc(t.subject)}</div><div class="pre">${esc(String(t.snippet || "").replace(/\s+/g, " "))}</div>
      <div class="meta">${t.channel === "linkedin" ? pill("LinkedIn", "info") : ""}${kindOf(t) ? pill(kindOf(t), kindTone(kindOf(t))) : ""}${td(t).sentAt && td(t).sentAt >= t.lastReply ? pill(td(t).queued ? "Queued" : "Sent", "good") : td(t).handled ? pill("Handled") : hasDraft(t) && td(t).draft ? pill("Draft ready", "accent") : S.drafting.has(t.id) ? pill("Drafting…") : ""}</div></div>`).join("")
    : empty("inbox", "Nothing here", S.threads.length ? "Try another filter." : "Replies from every Smartlead mailbox land here.");
  const pool = ib.tab === "sent" ? S.sent : th;
  const t = pool.find(x => x.id === ib.sel);
  return `<div class="page full"><div class="inbox ${t ? "has-sel" : ""}">
    <section class="ib-list" aria-label="Conversations"><div class="ib-head">
      <div style="display:flex;align-items:center;gap:8px"><h1>Inbox</h1><span style="margin-left:auto;display:flex;gap:6px"><button class="btn sm" data-act="compose">${I("pen")}Compose</button><span class="pill ${S.app.autoSend && S.app.autoSend.on ? "warn" : ""}" title="Change in Settings > Sending">${I(S.app.autoSend && S.app.autoSend.on ? "bolt" : "lock")} Auto-send ${S.app.autoSend && S.app.autoSend.on ? "on" : "off"}</span></span></div>
      <p>Every reply from every mailbox. Claude drafts each answer. Nothing sends until you click Send.</p>
      <div class="seg" role="tablist">${[["replies", "Replies"], ["nudges", "Nudges", nudges.filter(n => n.due).length], ["sent", "Sent"]].map(([v, l, n]) => `<button role="tab" data-act="ib-tab" data-v="${v}" aria-pressed="${ib.tab === v}">${l}${n ? ` <span class="n">${n}</span>` : ""}</button>`).join("")}</div>
      ${ib.tab === "replies" ? `<div class="seg">${[["reply", "To reply"], ["interested", "Interested"], ["done", "Done"]].map(([v, l]) => `<button data-act="ib-filter" data-v="${v}" aria-pressed="${ib.filter === v}">${l} <span class="n">${th.filter(groups[v]).length}</span></button>`).join("")}</div>` : ""}
    </div><div class="ib-items">${items}</div></section>
    <section class="thread" aria-label="Conversation">${t ? threadHtml(t, ib.tab === "nudges" ? nudges.find(n => n.t.id === t.id) : null) : empty("inbox", "Pick a conversation", "Its messages and Claude's draft reply open here.")}</section>
  </div></div>`;
};
function threadHtml(t, nudge) {
  const d = td(t), b = S.biz.find(x => x.id === t.biz) || B(), sentView = S.ib.tab === "sent";
  const answered = d.sentAt && d.sentAt >= (t.lastReply || 0);
  const draftText = nudge ? (d.nudgeDraft || "") : (d.edit != null ? d.edit : (d.draft || ""));
  const draftBox = sentView ? "" : nudge ? (d.nudgeDraft ? draftUI(t, draftText, [["good", `Nudge ${nudge.n + 1} of 2`]], "Claude's nudge", "nudge") : `<div class="callout">${I("bell")}<div><b>${nudge.due ? "This lead is due a nudge" : "Not due yet"}</b><p>Nudges add something new and never guilt-trip.</p><div style="margin-top:8px"><button class="btn primary sm" data-act="nudge-draft" data-id="${esc(t.id)}">${I("spark")}Draft a nudge</button></div></div></div>`)
    : answered ? `<div class="callout">${I("check")}<div><b>${d.queued ? "Queued to send" : "Replied"} ${ago(d.sentAt)}</b><p>If they write back, it shows up here.</p></div></div>`
    : (kindOf(t) === "Out of office" || kindOf(t) === "Unsubscribe") && !d.draft ? `<div class="callout">${I("info")}<div><b>No reply needed</b><p>${kindOf(t) === "Unsubscribe" ? "They're on Do not contact." : "Out of office. Their sequence carries on when they're back."}</p></div></div>`
    : d.draft != null && hasDraft(t) ? draftUI(t, draftText, d.checks || [], "Claude's draft", "reply")
    : S.drafting.has(t.id) ? `<div class="callout">${I("spark")}<div><b>Claude is drafting a reply…</b><p>It takes a few seconds.</p></div></div>`
    : `<div class="callout">${I("spark")}<div><b>No draft yet</b><p>${esc(S.sampleOff || "Claude writes one from your profile and their words.")}</p>${SAMPLE ? `<div style="margin-top:8px"><button class="btn primary sm" data-act="redraft">${I("spark")}Draft a reply</button></div>` : ""}</div></div>`;
  const msgs = (t.history && t.history.length ? t.history : [{ dir: "in", time: t.lastReply, text: t.snippet }]).slice(-12);
  return `<div class="th-head">
      <button class="btn ghost sm menu-back" data-act="ib-back" aria-label="Back to list">←</button>
      <div class="avatar">${esc(initials(t.name))}</div>
      <div style="min-width:0"><h2>${esc(t.name)}</h2><div class="faint" style="font-size:12.5px">${esc([t.title, t.company].filter(Boolean).join(", "))}${t.channel === "linkedin" ? " · LinkedIn" : " · " + esc(t.email)}</div></div>
      ${sentView ? "" : `<div class="r"><button class="btn sm" data-act="snooze">${I("clock")}Snooze</button><button class="btn sm" data-act="handled">${I("archive")}${isDone(t) ? "Move back" : "Mark handled"}</button>${t.channel === "email" ? `<button class="btn sm danger" data-act="dnc-thread">${I("ban")}Do not contact</button>` : ""}</div>`}
    </div>
    <div class="th-body"><div class="th-grid"><div style="display:grid;gap:14px;min-width:0">
      ${msgs.map(m => `<article class="msg ${m.dir === "out" ? "ours" : ""}"><div class="mh"><b>${m.dir === "out" ? esc((b && b.sender) || "You") : esc(t.name)}</b><span class="faint">${m.dir === "out" ? "You" : "Them"}</span><span class="time">${esc(m.time ? new Date(m.time).toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) : "")}</span></div><div class="mb">${esc(String(m.text || "").slice(0, 6000))}</div></article>`).join("")}
      ${draftBox}
    </div>
    <aside style="display:grid;gap:12px">
      <div class="side-card"><h3>Lead</h3><dl class="kv">
        ${t.company ? `<dt>Company</dt><dd>${esc(t.company)}</dd>` : ""}<dt>Reply type</dt><dd>${esc(kindOf(t) || "Not sorted yet")}</dd>
        ${sentView ? "" : `<dt>Stage</dt><dd><select class="in" style="height:28px;padding:2px 26px 2px 8px;font-size:12.5px" data-act="stage" data-id="${esc(t.id)}" aria-label="Stage">${(b ? b.stages : DEFAULT_STAGES).map(s => `<option ${s.id === stageOf(t) ? "selected" : ""}>${esc(s.id)}</option>`).join("")}</select></dd>
        <dt>Deal value</dt><dd><input class="in" id="val-${esc(t.id)}" data-act="deal-value" data-id="${esc(t.id)}" inputmode="numeric" style="height:28px;padding:2px 8px;font-size:12.5px;text-align:right;width:110px" value="${d.value ? esc(d.value) : ""}" placeholder="$0"></dd>`}

V.pipeline = () => {
  const b = B(), stages = b ? b.stages : DEFAULT_STAGES;
  const deals = allThreads().filter(t => td(t).stage || POSITIVE.has(kindOf(t)));
  const openD = deals.filter(t => !["Won", "Lost"].includes(stageOf(t)));
  const odds = Object.fromEntries(stages.map(s => [s.id, num(s.odds) / 100]));
  const forecast = deals.reduce((a, t) => a + num(td(t).value) * (odds[stageOf(t)] ?? .2), 0);
  return `<div class="page">
    ${head("Pipeline", "Deals by stage. Drag a card to move it. Set a deal's value from its conversation.")}
    <div class="kpis"><div class="kpi"><span class="l">Open deals</span><span class="v">${openD.length}</span></div><div class="kpi"><span class="l">Open value</span><span class="v">${money(openD.reduce((a, t) => a + num(td(t).value), 0))}</span></div>
      <div class="kpi"><span class="l">Weighted forecast</span><span class="v">${money(forecast)}</span><span class="d">Value × chance at each stage</span></div><div class="kpi"><span class="l">Won</span><span class="v">${money(deals.filter(t => stageOf(t) === "Won").reduce((a, t) => a + num(td(t).value), 0))}</span></div></div>
    ${deals.length ? `<div class="board">${stages.map(s => { const ds = deals.filter(t => stageOf(t) === s.id); return `<div class="col" data-drop="${esc(s.id)}"><div class="col-h"><i style="background:${esc(s.color)}"></i><b>${esc(s.id)}</b><span class="faint">${ds.length}</span><span class="sum">${money(ds.reduce((a, t) => a + num(td(t).value), 0))}</span></div>
      ${ds.map(t => `<div class="deal" draggable="true" data-deal="${esc(t.id)}" data-act="open-thread" data-id="${esc(t.id)}"><b>${esc(t.company || t.name)}</b><small>${esc(t.name)}</small><span class="v">${td(t).value ? money(td(t).value) : "–"}</span><small>${esc(kindOf(t) || "")}${t.lastReply ? " · " + ago(t.lastReply) : ""}</small></div>`).join("")}</div>`; }).join("")}</div>`
    : `<div class="card">${empty("board", "No deals yet", "People who reply show up here. Interested replies start in Interested.")}</div>`}
  </div>`;
};

    ${happening([`<span class="dot good"></span><b>${esc(b.calendar.tool || "Calendar")} connected</b>`, `${week.length} meeting${week.length === 1 ? "" : "s"} in the next 7 days`, S.app.calendarSyncedAt ? `Synced ${ago(ts(S.app.calendarSyncedAt))}` : 'Say "sync my calendar" in Claude to refresh'])}
    ${ms.length ? days.map(dk => `<section class="card"><div class="card-h"><h2>${new Date(dk).toDateString() === new Date().toDateString() ? "Today · " : ""}${new Date(dk).toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" })}</h2></div><div class="card-b" style="padding:8px 0 4px"><div class="rows">
      ${ms.filter(m => dayKey(m) === dk).map(m => `<div class="row"><span class="mono" style="width:72px;flex:none">${new Date(ts(m.start)).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" })}</span><span class="avatar">${esc(initials(m.name))}</span><span class="t"><div><b>${esc(m.name)}</b>${m.company ? " · " + esc(m.company) : ""}</div><small>${esc(m.what || "")}</small></span>${m.prep ? `<button class="btn sm" data-act="cal-prep" data-id="${esc(m.id)}">${I("spark")}Prep note</button>` : ""}</div>`).join("")}
    </div></div></section>`).join("") : `<div class="card">${empty("cal", "No meetings with leads coming up", "Booked meetings show up here after the next calendar sync.")}</div>`}

V.contacts = () => {

  const comp = {}; people.forEach(p => { const k = p.company || domainOf(p.email) || p.name; (comp[k] = comp[k] || { name: k, people: 0, stage: p.stage, value: 0 }).people++; });
  th.forEach(t => { const k = t.company || domainOf(t.email) || t.name; if (comp[k]) comp[k].value += num(td(t).value); });

  return `<div class="page">${head("Contacts", "Every person and company who has replied, with their stage.")}
    <div class="toolbar"><div class="seg">${[["people", "People", people.length], ["companies", "Companies", companies.length]].map(([v, l, n]) => `<button data-act="contacts" data-v="${v}" aria-pressed="${S.contacts === v}">${l} <span class="n">${n}</span></button>`).join("")}</div></div>
    ${people.length ? `<div class="tbl-wrap"><table>${S.contacts === "people"
      ? `<thead><tr><th>Person</th><th>Company</th><th>Email</th><th>Stage</th><th>Last reply</th></tr></thead><tbody>${people.map(p => `<tr class="click" data-act="open-thread" data-id="${esc(p.id)}"><td><div class="who"><span class="avatar">${esc(initials(p.name))}</span><span><b>${esc(p.name)}</b><small>${esc(p.title || "")}</small></span></div></td><td>${esc(p.company || "")}</td><td class="mono">${esc(p.email) || '<span class="faint">–</span>'}</td><td>${pill(p.stage)}</td><td class="faint">${esc(ago(p.last)) || "–"}</td></tr>`).join("")}</tbody>`
      : `<thead><tr><th>Company</th><th class="n">People</th><th>Stage</th><th class="n">Deal value</th></tr></thead><tbody>${companies.map(c => `<tr><td><div class="who"><span class="avatar" style="border-radius:8px">${I("building")}</span><b>${esc(c.name)}</b></div></td><td class="n">${c.people}</td><td>${pill(c.stage)}</td><td class="n">${c.value ? money(c.value) : "–"}</td></tr>`).join("")}</tbody>`}</table></div>`
    : `<div class="card">${empty("contact", "No contacts yet", "People who reply to your emails are added here automatically.")}</div>`}</div>`;

V.analytics = () => {
  const st = S.stats || {}, days = S.day || [];
  const kinds = {}; Object.values(S.tdocs).filter(d => inScope(d.biz) && d.kind).forEach(d => kinds[d.kind] = (kinds[d.kind] || 0) + 1);
  const kmax = Math.max(1, ...Object.values(kinds));
  const list = S.campaigns.filter(c => inScope(c.biz) && S.camStats[c.id] && camStat(c).sent).sort((a, b) => camStat(b).replies / Math.max(1, camStat(b).sent) - camStat(a).replies / Math.max(1, camStat(a).sent));
  const labels = days.map(d => new Date(d.date + "T12:00:00").toLocaleDateString(undefined, { month: "short", day: "numeric" }));
  return `<div class="page">${head("Analytics", "What's working: replies, positive replies, and which campaigns win. Open rates are left out on purpose; they're unreliable and tracking them hurts delivery.")}
    ${connBanner()}
    <div class="kpis"><div class="kpi"><span class="l">Sent, 30 days</span><span class="v">${fmt(st.sent)}</span></div><div class="kpi"><span class="l">Replies</span><span class="v">${fmt(st.replied)}</span><span class="d">${pct(st.replied, st.sent)} reply rate</span></div>
      <div class="kpi"><span class="l">Positive replies</span><span class="v">${["Interested", "Question", "Referral"].reduce((a, k) => a + (kinds[k] || 0), 0)}</span><span class="d">Sorted by Claude</span></div>
      <div class="kpi"><span class="l">Bounce rate</span><span class="v">${pct(st.bounced, st.sent)}</span><span class="d ${st.sent && st.bounced / st.sent < .02 ? "up" : ""}">${st.sent ? (st.bounced / st.sent < .02 ? "Healthy (under 2%)" : "Above 2%: check your lists") : ""}</span></div></div>
    <section class="card"><div class="card-h"><h2>Last 30 days</h2><span class="r legend"><span><i style="background:var(--accent)"></i>Emails sent</span><span><i style="background:var(--good)"></i>Replies</span></span></div>
      <div class="card-b chart">${S.load.stats === "busy" && !days.length ? loadingRow("stats") : days.some(d => d.sent) ? barChart(days.map(d => d.sent), labels, "var(--accent)") + barChart(days.map(d => d.replied), labels, "var(--good)", 90) : empty("chart", "No sends yet", "Charts fill in once your first campaign is sending.")}</div></section>
    <div class="cols"><section class="card"><div class="card-h"><h2>Which campaigns win</h2><span class="sub">By reply rate</span></div><div class="card-b">${list.length ? `<div class="tbl-wrap" style="border:0"><table><thead><tr><th>Campaign</th><th class="n">Sent</th><th class="n">Reply rate</th><th class="n">Interested</th></tr></thead><tbody>${list.map(c => { const s = camStat(c); return `<tr><td>${esc(c.name)}</td><td class="n">${fmt(s.sent)}</td><td class="n">${pct(s.replies, s.sent)}</td><td class="n">${s.interested}</td></tr>`; }).join("")}</tbody></table></div>` : empty("chart", "Not enough data yet", "Shows once campaigns have sent emails.")}</div></section>
      <section class="card"><div class="card-h"><h2>Reply types</h2><span class="sub">Sorted by Claude</span></div><div class="card-b">${Object.keys(kinds).length ? Object.entries(kinds).sort((a, b) => b[1] - a[1]).map(([k, n]) => `<div class="hbar"><span>${esc(k)}</span><div class="bar ${POSITIVE.has(k) ? "good" : k === "Unsubscribe" || k === "Not interested" ? "bad" : ""}"><i style="width:${n / kmax * 100}%"></i></div><span class="num faint" style="text-align:right">${n}</span></div>`).join("") : empty("chart", "No replies yet", "")}</div></section></div></div>`;
};

V.mailboxes = () => {

  acc.forEach(m => { (doms[m.domain] = doms[m.domain] || { domain: m.domain, n: 0, issues: 0 }).n++; if (m.status === "Disconnected" || m.status === "Check") doms[m.domain].issues++; });
  return `<div class="page">${head("Mailboxes", "The inboxes that send your email, and how healthy they are. New ones warm up for about 3 weeks before they send cold email.", `<button class="btn primary" data-act="add-mailboxes">${I("plus")}Add mailboxes</button>`)}

      ${acc.map(m => `<tr><td><span class="mono">${esc(m.email)}</span><div class="faint" style="font-size:12px">${esc(m.provider)}</div></td><td>${pill(m.status, m.status === "Ready" ? "good" : m.status === "Warming" ? "info" : m.status === "Check" ? "warn" : "bad")}</td>
        <td><div style="display:flex;align-items:center;gap:8px;min-width:150px"><div class="bar ${m.warmPct >= 100 ? "good" : ""}" style="flex:1"><i style="width:${m.warmPct}%"></i></div><span class="faint num" style="font-size:12px">${m.warmPct >= 100 ? "Done" : "Day " + m.day + "/18"}</span></div></td>

      <section class="card"><div class="card-h"><h2>Domains</h2><span class="sub">Ask Claude "check my domain records" to test SPF, DKIM and DMARC</span></div><div class="card-b"><div class="tbl-wrap" style="border:0"><table><thead><tr><th>Domain</th><th class="n">Mailboxes</th><th>Status</th></tr></thead><tbody>${Object.values(doms).map(d => `<tr><td class="mono">${esc(d.domain)}</td><td class="n">${d.n}</td><td>${d.issues ? pill(d.issues + " need attention", "warn") : pill("OK", "good")}</td></tr>`).join("")}</tbody></table></div></div></section>`
    : `<div class="card">${empty("mail", "No mailboxes yet", "Add mailboxes in Smartlead, or buy them set up and warmed.", `<button class="btn primary sm" data-act="add-mailboxes">${I("plus")}Add mailboxes</button>`)}</div>`}</div>`;

const INSTRUCTIONS = `
<div class="callout">${I("spark")}<div><b>Want something changed? Just ask.</b><p>Open Claude Code in your COMS AI folder and say what you want: "add a stage called Proposal", "make replies shorter", "add a column for city". Claude updates the CRM for you.</p></div></div>

<h3>Links</h3><p>Every link here opens in your normal browser.</p>`;

  if (/(city|location|town)/.test(s)) return "City"; if (/(message|comment|question)/.test(s)) return "Message"; if (/(source|channel)/.test(s)) return "Source"; if (/note/.test(s)) return "Notes"; return "Skip"; }

function feChecks(f, b, lead) {
  const out = [], w = words(f.body), sw = words(f.subject);
  out.push([w >= b.firstTouch.wordsMin && w <= b.firstTouch.wordsMax ? "good" : "warn", w + " words"]);
  out.push([sw && sw <= b.firstTouch.subjectMaxWords ? "good" : "warn", "Subject " + sw + " word" + (sw === 1 ? "" : "s")]);
  out.push([/https?:\/\/|www\./i.test(f.body) ? "warn" : "good", /https?:\/\/|www\./i.test(f.body) ? "Has a link" : "No links"]);
  const bad = (b.voice.banned || []).filter(x => x && (f.body + " " + f.subject).toLowerCase().includes(String(x).toLowerCase()));
  if (bad.length) out.push(["warn", "Uses: " + bad.slice(0, 2).join(", ")]);
  out.push([(lead.facts || []).length ? "good" : "warn", (lead.facts || []).length ? "Fact from a source" : "No public fact: generic email"]);
  if (/^(re|fwd?):/i.test(f.subject)) out.push(["warn", "Subject starts with Re/Fwd"]);
  if (checkOn() && lead.check) out.push([lead.check.result === "valid" ? "good" : "warn", lead.check.result === "valid" ? "Email valid" : "Email " + lead.check.result]);
  return out;
}
